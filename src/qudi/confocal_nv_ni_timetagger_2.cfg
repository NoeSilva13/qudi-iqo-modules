# Qudi configuration for an NV confocal setup that uses an NI X-series DAQ for positioning
# (analog output of the scanner voltages + exported sample clock) and a Swabian Instruments
# TimeTagger for photon counting via `CountBetweenMarkers`. The two are tied together by the
# `NiTimeTaggerScanningProbeInterfuse` interfuse.
#
# Required wiring:
#   - NI sample clock (set below as `/Dev1/PFI11`) -> TimeTagger digital channel 8
#   - APD TTL out                                  -> TimeTagger digital channel 1
#   - NI ao0/ao1/ao2                               -> scanner X / Y / Z inputs (galvos/piezo)
#
# Update the device name, channel numbers, position ranges and frequency limits to match your
# hardware before running.

global:
    startup_modules: []

    remote_modules_server:
        address: 'localhost'
        port: 12345

    namespace_server_port: 18861

    force_remote_calls_by_value: True

    stylesheet: 'qdark.qss'

    # Uncomment and set to override the default measurement data directory:
    # default_data_dir: 'C:\Users\BurkeLab\qudi\Data'

    daily_data_dirs: True


gui:
    scanner_gui:
        module.Class: 'scanning.scannergui.ScannerGui'
        options:
            image_axes_padding: 0.02
            default_position_unit_prefix: 'u'
            optimizer_plot_dimensions: [2, 1]
        connect:
            scanning_logic: scanning_probe_logic
            data_logic: scanning_data_logic
            optimize_logic: scanning_optimize_logic

    poi_manager_gui:
        module.Class: 'poimanager.poimanagergui.PoiManagerGui'
        options:
            data_scan_axes: xy
        connect:
            poi_manager_logic: poi_manager_logic

    # Live count-rate trace ("time series") fed by the TimeTagger.
    time_series_gui:
        module.Class: 'time_series.time_series_gui.TimeSeriesGui'
        options:
            use_antialias: True
        connect:
            _time_series_logic_con: time_series_reader_logic


logic:
    scanning_probe_logic:
        module.Class: 'scanning_probe_logic.ScanningProbeLogic'
        options:
            max_history_length: 20
            max_scan_update_interval: 2
            position_update_interval: 1
        connect:
            scanner: ni_timetagger_scanner

    scanning_data_logic:
        module.Class: 'scanning_data_logic.ScanningDataLogic'
        options:
            max_history_length: 20
        connect:
            scan_logic: scanning_probe_logic

    scanning_optimize_logic:
        module.Class: 'scanning_optimize_logic.ScanningOptimizeLogic'
        connect:
            scan_logic: scanning_probe_logic

    poi_manager_logic:
        module.Class: 'poi_manager_logic.PoiManagerLogic'
        connect:
            scanning_logic: scanning_probe_logic
            optimize_logic: scanning_optimize_logic
            data_logic: scanning_data_logic

    time_series_reader_logic:
        module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
        options:
            max_frame_rate: 20            # optional (default: 20 Hz)
            channel_buffer_size: 1048576  # optional (default: 1 MSample)
            max_raw_data_bytes: 1073741824  # optional (default: 1 GB)
        connect:
            streamer: tt_instreamer


hardware:
    # Top-level scanner. Talks to scanning_probe_logic via ScanningProbeInterface and orchestrates
    # the NI DAQ (positioning + clock) and the TimeTagger (counting) below.
    ni_timetagger_scanner:
        module.Class: 'interfuse.ni_timetagger_scanning_probe_interfuse.NiTimeTaggerScanningProbeInterfuse'
        # To disable tilt correction use the bare variant:
        # module.Class: 'interfuse.ni_timetagger_scanning_probe_interfuse.NiTimeTaggerScanningProbeInterfuseBare'
        connect:
            scan_output: ni_io
            analog_output: ni_ao
            counter: tt_counter
        options:
            ni_channel_mapping:
                x: 'ao0'
                y: 'ao1'
                z: 'ao2'
            position_ranges:  # in metres
                x: [-120e-6, 120e-6]
                y: [-120e-6, 120e-6]
                z: [0e-6, 450e-6]
            frequency_ranges:  # pixels per second per axis
                x: [1, 5000]
                y: [1, 5000]
                z: [1, 1000]
            resolution_ranges:  # min/max pixels per scan line
                x: [1, 10000]
                y: [1, 10000]
                z: [2, 1000]
            input_channel_units:
                fluorescence: 'c/s'   # logical name must match TimeTaggerFiniteCounter.channel_name
            default_backward_resolution: 50
            maximum_move_velocity: 400e-6  # m/s, used for cursor moves between scans

    # NI X-series finite sampling IO. Drives AO for the scanner and exports the sample clock on
    # a PFI line. No NI counters are used for photon counting; that is done by the TimeTagger
    # below.
    #
    # `FiniteSamplingIOConstraints` requires at least one declared input channel. We list a
    # placeholder `ai0: 'V'` here, but the new interfuse calls `set_active_channels(input_channels=())`,
    # so this channel is never actually activated, sampled or driven during a scan. The pin can
    # be left floating physically.
    ni_io:
        module.Class: 'ni_x_series.ni_x_series_finite_sampling_io.NIXSeriesFiniteSamplingIO'
        options:
            device_name: 'Dev1'
            input_channel_units:
                ai0: 'V'                        # placeholder, never activated by the interfuse
            output_channel_units:
                'ao0': 'V'
                'ao1': 'V'
                'ao2': 'V'
            adc_voltage_ranges:
                ai0: [-10, 10]                  # placeholder, matches the dummy channel above
            output_voltage_ranges:
                ao0: [-10, 10]
                ao1: [-10, 10]
                ao2: [0, 10]
            frame_size_limits: [1, 1000000000]
            output_mode: 'JUMP_LIST'
            read_write_timeout: 10
            sample_clock_output: '/Dev1/PFI8'   # REQUIRED: this PFI line goes to the TimeTagger

    # NI X-series analog output, used for software-timed cursor moves between scans.
    ni_ao:
        module.Class: 'ni_x_series.ni_x_series_analog_output.NIXSeriesAnalogOutput'
        options:
            device_name: 'Dev1'
            channels:
                ao0:
                    limits: [-10.0, 10.0]
                    keep_value: True
                ao1:
                    limits: [-10.0, 10.0]
                    keep_value: True
                ao2:
                    limits: [0, 10.0]
                    keep_value: True

    # Shared TimeTagger device. Owns the single physical connection, resets it once and starts a
    # TimeTagger server. Both measurement modules below connect to it and create their own
    # measurements on the SAME tagger instance, so a confocal scan (CountBetweenMarkers) and the
    # live time series (Counter) can run simultaneously. The server also lets external programs
    # connect via TimeTagger.createTimeTaggerNetwork('localhost:41101').
    tt_device:
        module.Class: 'swabian_instruments.timetagger_device.TimeTaggerDevice'
        options:
            # timetagger_serial: ''           # optional, target a specific device serial
            reset: True                       # reset the hardware once on activation
            start_server: True
            server_port: 41101
            access_mode: 'Control'

    # Swabian TimeTagger using CountBetweenMarkers. The NI sample clock (wired into channel 3)
    # defines the pixel boundaries; the APD click signal (wired into channel 1) is the input.
    tt_counter:
        module.Class: 'swabian_instruments.timetagger_finite_counter.TimeTaggerFiniteCounter'
        connect:
            timetagger: tt_device               # share the device (do not open its own connection)
        options:
            timetagger_channel_apd: 1           # APD click channel
            timetagger_channel_clock: 3         # channel that receives /Dev1/PFI11
            channel_name: 'fluorescence'        # must match input_channel_units above
            channel_unit: 'c/s'
            # trigger_level: 0.5                # optional, V (e.g. for 1.6 V TTL set ~0.8)
            sample_rate_limits: [1, 1000000]
            frame_size_limits: [1, 100000000]

    # Swabian TimeTagger as a continuous count-rate stream for the live time series display.
    # Uses TimeTagger.Counter (free-running internal binning); it does NOT need the NI sample
    # clock. The APD click channel is the same physical channel as the scanner counter (1).
    # It shares the same tt_device, so it can run at the same time as a confocal scan.
    tt_instreamer:
        module.Class: 'swabian_instruments.timetagger_instreamer.TimeTaggerInstreamer'
        connect:
            timetagger: tt_device               # share the device (do not open its own connection)
        options:
            channels:
                fluorescence: 1             # logical name -> APD click channel
            sample_rate_limits: [0.1, 1000000]
            channel_buffer_size: 1048576
            # The serial/reset options below are only used when NOT connected to tt_device.
            # timetagger_serial: ''         # optional, to target a specific device
            # reset: False
